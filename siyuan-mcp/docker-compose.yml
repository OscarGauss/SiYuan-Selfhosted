services:
  siyuan-mcp:
    build: .
    image: siyuan-mcp:latest
    container_name: siyuan-mcp
    environment:
      # Point at the SiYuan container by service name on the shared network.
      SIYUAN_BASE_URL: ${SIYUAN_BASE_URL:-http://siyuan:6806}
      SIYUAN_API_TOKEN: ${SIYUAN_API_TOKEN}
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: 3000
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_AUTH_TOKEN: ${MCP_HTTP_AUTH_TOKEN}
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Uncomment if siyuan runs in a separate compose project on an external network:
    # networks:
    #   - siyuan_default

# networks:
#   siyuan_default:
#     external: true
