services:
  siyuan-mcp:
    build: .
    image: siyuan-mcp:latest
    container_name: siyuan-mcp
    environment:
      SIYUAN_BASE_URL: ${SIYUAN_BASE_URL}
      SIYUAN_API_TOKEN: ${SIYUAN_API_TOKEN}
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: 3000
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_AUTH_TOKEN: ${MCP_HTTP_AUTH_TOKEN}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
